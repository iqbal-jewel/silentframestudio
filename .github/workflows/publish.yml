name: publish

# Runs hourly. Every post goes out through Facebook's own scheduler up to 7
# days ahead, so a missed or delayed run never drops a post -- it just gets
# picked up and scheduled on the next run. post_id idempotency in state
# stops anything being sent twice.
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      live:
        description: "Actually publish (otherwise dry run)"
        type: boolean
        default: false

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Scheduled runs publish only when the repo variable PUBLISH_ENABLED is
      # "true", so merging this workflow does not by itself start posting.
      - name: Decide mode
        id: mode
        env:
          ENABLED: ${{ vars.PUBLISH_ENABLED }}
          MANUAL_LIVE: ${{ inputs.live }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            [ "$MANUAL_LIVE" = "true" ] && echo "flag=--live" >> "$GITHUB_OUTPUT" || echo "flag=" >> "$GITHUB_OUTPUT"
          else
            [ "$ENABLED" = "true" ] && echo "flag=--live" >> "$GITHUB_OUTPUT" || echo "flag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        env:
          SILENTFRAMESSTUDIO_PAGE_ID: ${{ secrets.SILENTFRAMESSTUDIO_PAGE_ID }}
          SILENTFRAMESSTUDIO_PAGE_TOKEN: ${{ secrets.SILENTFRAMESSTUDIO_PAGE_TOKEN }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          python -m src.publish status
          python -m src.publish schedule --days 7 ${{ steps.mode.outputs.flag }}

      - name: Commit state
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/state.json
          git diff --staged --quiet || git commit -m "state: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
